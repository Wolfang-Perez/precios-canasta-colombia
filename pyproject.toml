# Metadatos del proyecto
[project]
name = "precios-canasta-colombia"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Wolfang Perez", email = "wolfangfpr@gmail.com" }
]
requires-python = ">=3.12"

# Stackt del proyecto
dependencies = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "seaborn>=0.13.2",
    "xlrd>=2.0.2",
]

# Cómo se contruye el paquete
[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

# Dependencias de desarrollo
[dependency-groups]
dev = [
    "black>=26.10.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.uv.build-backend]
module-name = "precios_canasta_colombia"
[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
[tool.ruff.lint.isort]
known-first-party = ["precios_canasta_colombia"]
[tool.black]
line-length = 88
target-version = ["py312"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
